apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inventree.fullname" . }}
  labels:
    {{- include "inventree.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "inventree.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "inventree.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.global.initEnabled }}
      initContainers:
        - name: init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ['/bin/sh', '-c']
          args:
            - >
              invoke migrate &&
              invoke static
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: inventree-data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: INVENTREE_SITE_URL
              value: {{ .Values.global.siteUrl }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end -}}
            {{- (include "inventree.renderSecrets" (dict "data" .Values.global.dbSecrets)) | nindent 12 -}}
      {{- end -}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "inventree.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- include "inventree.env.common" . | nindent 12 -}}
            {{- /*
            Backend-specific environment variables 
            */}}
            - name: INVENTREE_TRUSTED_ORIGINS
              value: {{ (include "ingress.listHosts" (dict "data" . )) }}
            {{- with .Values.global.ssoConfig }}
            {{- if .backends }}
            - name: INVENTREE_SOCIAL_BACKENDS
              value: {{ join "," .backends |squote }}
            {{- end -}}
            {{- if .providerSecretName }}
            - name: INVENTREE_SOCIAL_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: {{ .providerSecretName }}
                  key: providers
            {{- end -}}
            {{- end -}}
          {{- if .Values.global.adminSecret }}
          envFrom:
            - secretRef:
                name: "{{ .Values.global.adminSecret }}"
          {{- end }}
          {{/*
          # Disabled temporary, due to `... does not match the SITE_URL errors`
          # https://github.com/inventree/InvenTree/issues/10331
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          */}}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: inventree-data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: inventree-proxy
          image: {{ .Values.serviceProxy.image }}:{{ .Values.serviceProxy.tag}}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: proxy-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: inventree-data
              mountPath: /var/www
            {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: proxy-conf
          configMap:
            name: nginx-proxy-config
        {{- if .Values.persistence.enabled }}
        - name: inventree-data
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{ else }}inventree-data{{ end }}
        {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
